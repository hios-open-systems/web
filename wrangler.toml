# wrangler config — used for local D1 work (wrangler pages dev / wrangler d1 execute).
# Bindings in production come from the Cloudflare Pages dashboard, this file just
# mirrors the names so local dev and migrations target the same shape.

name = "hios-platform"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Variables no-secretas. El client_id de OAuth GitHub no es secreto (se ve en
# la URL del authorize), AUTH_BASE_URL es el dominio público.
# El GITHUB_CLIENT_SECRET se maneja como Secret desde el dashboard de Pages.
[vars]
GITHUB_CLIENT_ID = "Ov23licdOWRnG6AVSnyR"
AUTH_BASE_URL = "https://openhios.dev"

[[d1_databases]]
binding = "DB"
database_name = "hios-playground"
# Reemplazá database_id por el ID real cuando crees la D1 en el dashboard.
database_id = "a3b55142-933d-451e-aa95-21eb1231516a"
migrations_dir = "migrations"
