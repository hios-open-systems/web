; ============================================================================
;  Macropad / Control Deck - ESP32-S3
;  Firmware definitivo multi-transporte (USB HID + BLE HID + WiFi).
;  Se construye por milestones (ver plan). Las deps de cada transporte se
;  agregan en su milestone para mantener el build liviano mientras tanto.
; ============================================================================

[env:esp32-s3-devkitc-1]
platform   = espressif32
; Placa: si tu modulo es otro (N16R8, etc.) cambiala aca. La nuestra es N8.
board      = esp32-s3-devkitc-1
framework  = arduino
; Particion 8MB (placa N8): deja NVS estable (calibracion/creds) + espacio para WiFi.
board_build.partitions = default_8MB.csv

monitor_speed  = 115200
; En WSL2 la placa se adjunta con usbipd y aparece como /dev/ttyACM0.
; Lo fijamos para que pio no auto-detecte mal (/dev/ttyS0). Ajustalo si cambia.
monitor_port  = /dev/ttyACM0
upload_port   = /dev/ttyACM0

build_flags =
    ; USB HID por el USB nativo (GPIO19/20). CRITICO: MODE=0 = USB-OTG (TinyUSB),
    ; el unico que soporta HID. MODE=1 (Hardware CDC/JTAG) enumera pero NO hace
    ; HID -> el pad no gobierna la PC. Con CDC_ON_BOOT=0 el Serial de debug sigue
    ; por UART0 -> CH343 -> /dev/ttyACM0, y el USB nativo queda SOLO como HID.
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

    ; BLE por NimBLE (no Bluedroid): ~30-40KB menos de heap -> entra el sprite del
    ; menu y mejor coexistencia con WiFi. Transporte: HID compuesto propio (NimBLEHIDDevice).

    ; ====================================================================
    ;  TFT_eSPI: TODA la configuracion va por build flags (no tocar la lib)
    ; ====================================================================

    ; ---- Driver CONFIRMADO: ILI9488 (18-bit, 480x320) --------------------
    -D USER_SETUP_LOADED=1
    ; Puerto SPI dedicado (HSPI/SPI3). En el ESP32-S3, sin esto TFT_eSPI usa el
    ; bus 'SPI' global y la init queda a medias -> panic StoreProhibited.
    -D USE_HSPI_PORT
    -D ILI9488_DRIVER=1

    ; ---- Pines SPI de la TFT (etiquetas del modulo entre parentesis) -------
    -D TFT_MISO=-1               ; SDO/MISO NO conectado (solo escribimos)
    -D TFT_MOSI=11               ; SDI
    -D TFT_SCLK=12               ; SCL
    -D TFT_CS=10                 ; CS (CD)
    -D TFT_DC=13                 ; DC/RS
    -D TFT_RST=14                ; RESET
    ; El backlight (LED -> GPIO21) se controla por software con PWM en codigo,
    ; por eso NO definimos TFT_BL aca (evita que la lib pelee por el pin).

    ; ---- Fuentes incluidas en flash --------------------------------------
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; ---- Velocidad SPI ----------------------------------------------------
    ; ILI9488 tope ~27 MHz. A 27 para fluidez (menos tiempo de push de sprites).
    ; Si llegaras a ver basura/artefactos, bajar a 20000000.
    -D SPI_FREQUENCY=27000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    ricmoo/QRCode @ ^0.0.1
    bblanchon/ArduinoJson @ ^7.1.0
    h2zero/NimBLE-Arduino @ ^1.4.1
