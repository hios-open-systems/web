; HIOS Speaker Test - banco de pruebas de audio
; ESP32 clasico (NO S3): recibe audio por Bluetooth A2DP y lo saca
; por I2S a dos MAX98357A (uno canal L, otro canal R).
; El S3 no sirve aca: no tiene Bluetooth Classic / A2DP, solo BLE.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.2
