; HIOS Speaker Test - banco de pruebas de audio
; ESP32 clasico (NO S3): recibe audio por Bluetooth A2DP y lo saca
; por I2S a dos MAX98357A (uno canal L, otro canal R).
; El S3 no sirve aca: no tiene Bluetooth Classic / A2DP, solo BLE.
;
; Dos firmwares (elegi el env al flashear):
;   pio run -e a2dp   -t upload   -> recibe audio del celu por Bluetooth
;   pio run -e tono   -t upload   -> genera un tono por I2S, sin BT (diagnostico)
;   pio run -e song   -t upload   -> chiptune estilo retro por I2S, sin BT
;   pio run -e player -t upload   -> reproductor de canciones compuestas (M1+)

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:a2dp]
build_src_filter = +<main.cpp>
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.2

[env:tono]
build_src_filter = +<tone_test.cpp>

[env:song]
build_src_filter = +<song.cpp>

; Reproductor de chiptune data-driven. Compila solo el subarbol player/
; (aislado de los envs de un solo archivo). ArduinoJson parsea el wire v:2.
[env:player]
build_src_filter = -<*> +<player/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
board_build.filesystem = littlefs
build_flags =
    -D WIFI_SSID='"CAMBIAME"'
    -D WIFI_PASS='"CAMBIAME"'
    -D PLAYER_MDNS='"hioschip"'
