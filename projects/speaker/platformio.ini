; HIOS WiFi Speaker - PlatformIO Configuration
; https://github.com/hios-open-systems/web/tree/main/projects/speaker
;
; Firmware v3.0 - WiFi + Bluetooth Audio Hub

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerias necesarias
lib_deps =
    ; Audio
    https://github.com/schreibfaul1/ESP32-audioI2S
    https://github.com/pschatzmann/ESP32-A2DP

    ; Display
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

    ; Networking
    WiFi
    WebServer
    ESPmDNS
    HTTPClient
    ArduinoOTA
    Preferences

; Configuracion de build
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    ; Habilitar WiFi + BT coexistence
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1

; Particion con mas espacio para app (BT + WiFi + Audio necesitan memoria)
board_build.partitions = huge_app.csv

; Configuracion de upload
upload_speed = 921600

; Configuracion de monitor
monitor_filters =
    esp32_exception_decoder
    time
