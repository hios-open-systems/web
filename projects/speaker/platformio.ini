; HIOS WiFi Speaker - PlatformIO Configuration
; https://github.com/hios-open-systems/web/tree/main/projects/speaker

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerias necesarias
lib_deps =
    ESP8266Audio
    ESP32-audioI2S
    WiFi
    WebServer
    ESPmDNS

; Configuracion de build
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0

; Configuracion de upload
upload_speed = 921600

; Configuracion de monitor
monitor_filters =
    esp32_exception_decoder
    time
