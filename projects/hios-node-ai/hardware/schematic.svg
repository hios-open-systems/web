<text x="32" y="936" class="modname">Rieles de alimentación</text>
<rect x="32" y="942" width="1056" height="25" class="rail"/>
<text x="44" y="957" class="railname">BAT (3.0–4.2V)</text>
<text x="252" y="957" class="power">TP4056 OUT+ → SW1 → U3V40F5 VIN · divisor VBAT</text>
<rect x="32" y="975" width="1056" height="25" class="rail"/>
<text x="44" y="990" class="railname">5V</text>
<text x="252" y="990" class="power">U3V40F5 VOUT → MAX98357A VIN + 220µF · U3V40F5 VOUT → SS34 → DevKit 5V (J1 pin 21)</text>
<rect x="32" y="1008" width="1056" height="25" class="rail"/>
<text x="44" y="1023" class="railname">3V3</text>
<text x="252" y="1023" class="power">LDO del DevKit (J1 pin 1) → INMP441 VDD · OLED VCC</text>
<rect x="32" y="1041" width="1056" height="25" class="rail"/>
<text x="44" y="1056" class="railname">GND común</text>
<text x="252" y="1056" class="power">TP4056 OUT− · U3V40F5 GND · DevKit G · todos los módulos</text>
</svg>
