<path d="M332 732 H600" class="wire"/>
<text x="32" y="778" class="meta">Línea roja punteada = el pin tiene una nota: leela en hardware/README.md antes de soldar.</text>
<text x="32" y="802" class="modname">Rieles de alimentación</text>
<rect x="32" y="808" width="1056" height="25" class="rail"/>
<text x="44" y="823" class="railname">5V</text>
<text x="252" y="823" class="power">MAX98357A VIN · 220µF cerca del ampli</text>
<rect x="32" y="841" width="1056" height="25" class="rail"/>
<text x="44" y="856" class="railname">3V3</text>
<text x="252" y="856" class="power">INMP441 VDD · OLED VCC</text>
<rect x="32" y="874" width="1056" height="25" class="rail"/>
<text x="44" y="889" class="railname">GND común</text>
<text x="252" y="889" class="power">todos los módulos</text>
