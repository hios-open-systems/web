<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1104" viewBox="0 0 1120 1104">
<title>HIOS Node AI — esquema de cableado</title>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#111}
.title{font-size:20px;font-weight:700}.meta{font-size:11px;fill:#444}
.warn{font-size:12px;fill:#b00020;font-weight:700}
.modname{font-size:13px;font-weight:700}.power{font-size:11px;fill:#333}
.pin{font-size:11px}.gpio{font-size:11px;text-anchor:end;font-weight:700}
.mcu{fill:#eef4ff;stroke:#1d4ed8;stroke-width:2}.mod{fill:#f7f7f7;stroke:#333;stroke-width:1.5}
.rail{fill:#fff8e6;stroke:#b7791f}.railname{font-size:12px;font-weight:700}
.wire{stroke:#1d4ed8;stroke-width:1.5;fill:none}.flag{stroke:#b00020;stroke-dasharray:5 3}.dot{fill:#1d4ed8}
</style>
<rect width="1120" height="1104" fill="#ffffff"/>
<text x="32" y="36" class="title">HIOS Node AI — esquema de cableado (rev 1.0)</text>
<text x="32" y="58" class="meta">MCU: ESP32-S3-DevKitC-1 (N16R8) · pines desde projects/hios-node-ai/src/main.cpp</text>
<text x="32" y="76" class="meta">Generado por scripts/gen-hardware-docs.ts. Pines verificados contra el firmware por npm test. Cableado entre módulos, no una PCB.</text>
<text x="32" y="100" class="warn">⚠ Diseño completo pero todavía no armado ni compilado: probalo módulo por módulo con la checklist antes de cerrar la caja.</text>
<text x="32" y="116" class="warn">⚠ El micrófono queda cableado y reservado (GPIO40–42); el firmware aún no lo lee. Para voz hace falta además un servidor de</text>
<text x="32" y="132" class="warn">transcripción en la PC: Ollama solo recibe texto.</text>
<text x="32" y="160" class="modname">Camino de la energía</text>
<rect x="32" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="40" y="191" class="railname">18650 (1S)</text>
<rect x="212.66666666666666" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="220.66666666666666" y="191" class="railname">TP4056 + DW01A</text>
<path d="M186.66666666666666 187 H208.66666666666666" class="wire"/><path d="M203.66666666666666 182 L209.66666666666666 187 L203.66666666666666 192" class="wire"/>
<rect x="393.3333333333333" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="401.3333333333333" y="191" class="railname">SW1</text>
<path d="M367.3333333333333 187 H389.3333333333333" class="wire"/><path d="M384.3333333333333 182 L390.3333333333333 187 L384.3333333333333 192" class="wire"/>
<rect x="574" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="582" y="191" class="railname">U3V40F5 5V</text>
<path d="M548 187 H570" class="wire"/><path d="M565 182 L571 187 L565 192" class="wire"/>
<rect x="754.6666666666666" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="762.6666666666666" y="191" class="railname">SS34</text>
<path d="M728.6666666666666 187 H750.6666666666666" class="wire"/><path d="M745.6666666666666 182 L751.6666666666666 187 L745.6666666666666 192" class="wire"/>
<rect x="935.3333333333333" y="170" width="152.66666666666666" height="34" class="rail"/>
<text x="943.3333333333333" y="191" class="railname">DevKit 5V → LDO 3V3</text>
<path d="M909.3333333333333 187 H931.3333333333333" class="wire"/><path d="M926.3333333333333 182 L932.3333333333333 187 L926.3333333333333 192" class="wire"/>
<rect x="600" y="224" width="488" height="64" class="mod"/>
<text x="612" y="242" class="modname">Energía 1S → 5V</text>
<text x="612" y="260" class="power">18650 → TP4056 con protección → SW1 → Pololu U3V40F5 (5V) → SS34 →</text>
<text x="612" y="275" class="power">pin 5V del DevKit · 5V del boost → MAX98357A</text>
<rect x="600" y="302" width="488" height="73" class="mod"/>
<text x="612" y="320" class="modname">Medición de batería</text>
<text x="612" y="338" class="power">divisor 100k/100k desde la salida del switch + 100nF a GND</text>
<circle cx="600" cy="359" r="3" class="dot"/>
<text x="612" y="363" class="pin">VBAT ADC: ← punto medio del divisor 100k/100k (4.2V → 2.1V)</text>
<rect x="600" y="389" width="488" height="121" class="mod"/>
<text x="612" y="407" class="modname">Micrófono INMP441 (I2S)</text>
<text x="612" y="425" class="power">VDD → 3V3 · GND → GND · L/R → GND (canal izquierdo)</text>
<circle cx="600" cy="446" r="3" class="dot"/>
<text x="612" y="450" class="pin">I2S Mic SCK: → SCK del INMP441</text>
<circle cx="600" cy="470" r="3" class="dot"/>
<text x="612" y="474" class="pin">I2S Mic WS: → WS del INMP441</text>
<circle cx="600" cy="494" r="3" class="dot"/>
<text x="612" y="498" class="pin">I2S Mic SD: ← SD del INMP441</text>
<rect x="600" y="524" width="488" height="136" class="mod"/>
<text x="612" y="542" class="modname">MAX98357A (I2S)</text>
<text x="612" y="560" class="power">VIN → 5V del boost · GND → GND · GAIN → GND (12 dB) · SD → VIN</text>
<text x="612" y="575" class="power">carga: Parlante 4Ω 3W a OUT+ / OUT− (ningún borne a GND)</text>
<circle cx="600" cy="596" r="3" class="dot"/>
<text x="612" y="600" class="pin">I2S Amp BCLK: → BCLK del MAX98357A</text>
<circle cx="600" cy="620" r="3" class="dot"/>
<text x="612" y="624" class="pin">I2S Amp LRC: → LRC del MAX98357A</text>
<circle cx="600" cy="644" r="3" class="dot"/>
<text x="612" y="648" class="pin">I2S Amp DIN: → DIN del MAX98357A</text>
<rect x="600" y="674" width="488" height="97" class="mod"/>
<text x="612" y="692" class="modname">OLED SSD1306 0.96&quot; (I2C 0x3C)</text>
<text x="612" y="710" class="power">VCC → 3V3 · GND → GND</text>
<circle cx="600" cy="731" r="3" class="dot"/>
<text x="612" y="735" class="pin">I2C SDA: → SDA del OLED</text>
<circle cx="600" cy="755" r="3" class="dot"/>
<text x="612" y="759" class="pin">I2C SCL: → SCL del OLED</text>
<rect x="600" y="785" width="488" height="97" class="mod"/>
<text x="612" y="803" class="modname">Botón PTT + LED de estado</text>
<text x="612" y="821" class="power">botón a GND · LED vía 330Ω a GND</text>
<circle cx="600" cy="842" r="3" class="dot"/>
<text x="612" y="846" class="pin">Botón PTT: → pulsador → GND (INPUT_PULLUP)</text>
<circle cx="600" cy="866" r="3" class="dot"/>
<text x="612" y="870" class="pin">LED estado: → 330Ω → ánodo del LED; cátodo → GND</text>
<rect x="32" y="224" width="300" height="658" class="mcu"/>
<text x="44" y="244" class="modname">ESP32-S3-DevKitC-1 (N16R8)</text>
<text x="320" y="363" class="gpio">VBAT ADC · GPIO1</text>
<path d="M332 359 H600" class="wire"/>
<text x="320" y="450" class="gpio">I2S Mic SCK · GPIO42</text>
<path d="M332 446 H600" class="wire"/>
<text x="320" y="474" class="gpio">I2S Mic WS · GPIO41</text>
<path d="M332 470 H600" class="wire"/>
