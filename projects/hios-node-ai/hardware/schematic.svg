<path d="M332 597 H600" class="wire"/>
<text x="320" y="625" class="gpio">I2C SCL · GPIO22</text>
<path d="M332 621 H600" class="wire flag"/>
<text x="320" y="712" class="gpio">Botón PTT · GPIO4</text>
<path d="M332 708 H600" class="wire"/>
