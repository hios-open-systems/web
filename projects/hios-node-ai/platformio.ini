; PlatformIO Configuration File para HIOS Node AI
; Credenciales: reemplazá los CAMBIAME localmente y no commitees ese cambio
; (git update-index --skip-worktree platformio.ini ayuda a no subirlo).
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -D WIFI_SSID='"CAMBIAME"'
    -D WIFI_PASS='"CAMBIAME"'
    -D OLLAMA_URL='"http://192.168.1.50:11434/api/chat"'
    -D MODEL_NAME='"llama3.1:8b"'
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
