<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// HIOS PAD cover: printed case from public/downloads/pad/*.stl, controls at the cutouts of tapa-superior.stl.
import { THREE, RoundedBoxGeometry, studio, stl, at, mesh, pla, canvasTex, shoot, W, H } from './studio.js';
const { renderer, scene } = studio({ accent: 0x38bdf8 });
const dev = new THREE.Group(); scene.add(dev);
const body = pla(0x0b6fb0, { roughness: 0.5 });
const S = '/public/downloads/pad/';
for (const f of ['box.stl', 'front_plate.stl', 'tapa-superior.stl']) dev.add(await stl(S + f, body));
// 4" ILI9488 module on standoffs over the display windows, as on the rev09 build
dev.add(mesh(new RoundedBoxGeometry(106, 1.6, 66, 2, 0.6), pla(0xb3261e, { roughness: 0.5 }), at(0, 119, 6.5)));
dev.add(mesh(new THREE.BoxGeometry(98, 2, 60), pla(0x0e0f12, { roughness: 0.25, clearcoat: 1 }), at(0, 119.5, 8.2)));
const standoff = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 1, roughness: 0.3 });
for (const [x, y] of [[-49, 89], [49, 89], [-49, 149], [49, 149]]) dev.add(mesh(new THREE.CylinderGeometry(1.6, 1.6, 6, 16), standoff, at(x, y, 4.5)));

// 480x320 control-deck UI on the 84x56 mm active area
const ui = canvasTex(1680, 1120, (c) => {
  c.scale(2, 2); c.fillStyle = '#0d1117'; c.fillRect(0, 0, 840, 560);
  c.fillStyle = '#22d3ee'; c.fillRect(0, 0, 840, 6);
  c.fillStyle = '#e6edf3'; c.font = 'bold 30px sans-serif'; c.fillText('HIOS', 24, 48);
  c.fillStyle = '#22d3ee'; c.font = '24px sans-serif'; c.fillText('DEV', 112, 48);
  c.fillStyle = '#8b949e'; c.textAlign = 'right'; c.fillText('21:42', 816, 48); c.textAlign = 'left';
  const labels = ['Build', 'Run', 'Debug', 'Commit', 'Push', 'Term', 'Mute', 'Cam', 'Shot', 'Lock'];
  const acc = ['#22d3ee', '#34d399', '#f472b6', '#fb923c', '#a78bfa', '#22d3ee', '#f87171', '#34d399', '#facc15', '#a78bfa'];
  for (let i = 0; i < 10; i++) {
    const x = 24 + (i % 5) * 160, y = 80 + Math.floor(i / 5) * 180;
    c.fillStyle = '#161b22'; c.beginPath(); c.roundRect(x, y, 148, 164, 14); c.fill();
    c.fillStyle = acc[i]; c.fillRect(x + 16, y + 18, 36, 6);
    c.fillStyle = '#e6edf3'; c.font = '600 26px sans-serif'; c.fillText(labels[i], x + 16, y + 140);
  }
  c.strokeStyle = '#22d3ee'; c.lineWidth = 3; c.beginPath();
  for (let i = 0; i < 56; i++) { const x = 24 + i * 14.4, y = 520 - 14 * Math.abs(Math.sin(i * 0.35)) - 5 * Math.sin(i * 1.3); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
});
const scr = mesh(new THREE.PlaneGeometry(84, 56), new THREE.MeshPhysicalMaterial({ map: ui, emissive: 0xffffff, emissiveMap: ui, emissiveIntensity: 1.0, roughness: 0.1, clearcoat: 1 }), at(0, 119.5, 9.25), false);
scr.rotation.x = -Math.PI / 2; dev.add(scr);

// keycaps over the 2x5 matrix and the two ALT keys
const capMat = pla(0x24262b, { roughness: 0.6, clearcoat: 0 });
const capGeo = new RoundedBoxGeometry(15, 7, 15, 4, 1.8);
const keys = [];
for (const y of [31.4, 12.9]) for (const x of [-37, -18.5, 0, 18.5, 37]) keys.push([x, y]);
keys.push([-40.5, 60.2], [-22, 60.2]);
for (const [x, y] of keys) dev.add(mesh(capGeo, capMat, at(x, y, 6.5)));

// encoder knob (knurled) and thumb joystick
const knurl = new THREE.MeshStandardMaterial({ color: 0x2b2c30, metalness: 0.85, roughness: 0.35 });
dev.add(mesh(new THREE.CylinderGeometry(6.6, 7, 12, 48), knurl, at(0, 60.2, 8.5)));
dev.add(mesh(new THREE.CylinderGeometry(6.3, 6.3, 0.4, 48), new THREE.MeshStandardMaterial({ color: 0xdadada, metalness: 1, roughness: 0.25 }), at(0, 60.2, 14.6)));
for (let i = 0; i < 32; i++) {
  const a = (i / 32) * Math.PI * 2, r = mesh(new THREE.BoxGeometry(0.6, 11, 0.8), knurl, at(Math.cos(a) * 6.8, 60.2 + Math.sin(a) * 6.8, 8.5));
  r.rotation.y = a; dev.add(r);
}
const dark = pla(0x2a2c31, { roughness: 0.85, clearcoat: 0 });
dev.add(mesh(new THREE.CylinderGeometry(2.4, 2.4, 6, 16), dark, at(36.5, 60.2, 4)));
dev.add(mesh(new THREE.CylinderGeometry(8.8, 8.4, 5, 48), dark, at(36.5, 60.2, 9.5)));
const ring = mesh(new THREE.TorusGeometry(6.4, 0.9, 12, 48), dark, at(36.5, 60.2, 12)); ring.rotation.x = Math.PI / 2; dev.add(ring);
const screw = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 1, roughness: 0.3 });
for (const [dx, dy] of [[-12.5, -10], [12.5, -10], [-12.5, 10], [12.5, 10]]) dev.add(mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.8, 20), screw, at(36.5 + dx, 60.2 + dy, 2.9)));

dev.position.y = 32.5; dev.position.z = 80;
const cam = new THREE.PerspectiveCamera(26, W / H, 1, 4000);
cam.position.set(-190, 260, 260); cam.lookAt(5, 22, 8);
shoot(renderer, scene, cam);
</script></body></html>
