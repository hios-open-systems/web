name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          # >=22.6: los self-tests corren con --experimental-strip-types.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:padwebui es el único self-test que no es zero-dep: maneja un
      # server mock con chromium (Playwright). Sin el browser, el runner lo
      # descubre y falla. --with-deps para no depender de libs del sistema.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Self-tests
        run: npm test

  build:
    name: Build (Workers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Buildea el mismo target que publica Workers Builds
      # (`npx opennextjs-cloudflare build`, ver DEPLOY.md), no `next build`.
      # Los bugs propios del Worker — SSR de antd, imágenes, prerender — no
      # aparecen en un `next build`, así que validar eso no protegía de nada.
      - name: OpenNext build
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify rendered SEO metadata and sitemap
        run: |
          npm run test:seo -- --built
          npm run test:sitemap -- --built
          npm run test:software

      - name: Install browser for tool content checks
        run: npx playwright install --with-deps chromium

      - name: Verify tool content and hydration
        run: npx playwright test tests/tool-content.spec.ts tests/project-software.spec.ts tests/section-navigation.spec.ts tests/project-stl.spec.ts tests/network-locality.spec.ts tests/local-inputs.spec.ts --project=chromium --workers=1

      - name: Verify instruments, electronics and localized pinouts
        run: npx playwright test tests/instruments.spec.ts tests/i2s-shared.spec.ts tests/electronics-shared.spec.ts tests/pinouts.spec.ts tests/pinout-translations.spec.ts tests/wiring-guide-translations.spec.ts --project=chromium --workers=2

      - name: Verify hardware tools on mobile and tablet
        run: npx playwright test tests/mobile-instruments.spec.ts tests/mobile-electronics.spec.ts tests/mobile-pinouts.spec.ts tests/mobile-wiring-guides.spec.ts --project=mobile-360 --project=mobile-390 --project=tablet-768 --workers=2

      - name: Audit implicit outbound traffic on every public route
        run: npx playwright test tests/site-locality.spec.ts --project=chromium --workers=3

      - name: Verify mobile layouts and interactions
        run: npx playwright test tests/mobile-responsive.spec.ts tests/mobile-usability.spec.ts tests/mobile-section-access.spec.ts --project=mobile-360 --project=mobile-390 --project=tablet-768 --workers=2

      - name: Audit all public pages at the narrowest supported width
        run: npx playwright test tests/mobile-pages.spec.ts --project=mobile-360 --workers=2

      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
