name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # >=22.6: los self-tests corren con --experimental-strip-types.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:padwebui es el único self-test que no es zero-dep: maneja un
      # server mock con chromium (Playwright). Sin el browser, el runner lo
      # descubre y falla. --with-deps para no depender de libs del sistema.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Self-tests
        run: npm test

  build:
    name: Build (Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Buildea el mismo target que publica Workers Builds
      # (`npx opennextjs-cloudflare build`, ver DEPLOY.md), no `next build`.
      # Los bugs propios del Worker — SSR de antd, imágenes, prerender — no
      # aparecen en un `next build`, así que validar eso no protegía de nada.
      - name: OpenNext build
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
