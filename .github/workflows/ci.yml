name: Manual verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release (manual fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Gitleaks
        shell: bash
        run: |
          mkdir -p .release-tools
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C .release-tools gitleaks
      - name: Bootstrap dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Run the same local release verification
        run: npm run release:verify
        env:
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
