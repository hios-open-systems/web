name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy is manual: Actions → CI → "Run workflow" on main. It runs the full
  # validation first and publishes only if everything passes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production upload when a newer commit arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          # >=22.6: los self-tests corren con --experimental-strip-types.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:padwebui es el único self-test que no es zero-dep: maneja un
      # server mock con chromium (Playwright). Sin el browser, el runner lo
      # descubre y falla. --with-deps para no depender de libs del sistema.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Self-tests
        run: npm test

  build:
    name: Build (Workers)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Construye una vez: este mismo output se prueba y publica al final.
      # Los bugs propios del Worker — SSR de antd, imágenes, prerender — no
      # aparecen en un `next build`, así que validar eso no protegía de nada.
      - name: OpenNext build
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}

      # The consent test exercises the browser -> Worker -> D1 flow.
      - name: Install browser for security and tool content checks
        run: npx playwright install --with-deps chromium

      - name: Verify authentication and endpoint permissions against local D1
        run: npm run test:security
        env:
          SECURITY_WORKER: '1'

      - name: Verify rendered SEO metadata and sitemap
        run: |
          npm run test:seo -- --built
          npm run test:sitemap -- --built
          npm run test:software

      - name: Verify tool content and hydration
        run: npx playwright test tests/tool-content.spec.ts tests/project-software.spec.ts tests/section-navigation.spec.ts tests/project-stl.spec.ts tests/network-locality.spec.ts tests/local-inputs.spec.ts tests/analytics.spec.ts tests/landing-styles.spec.ts tests/discovery-demos.spec.ts tests/google-login.spec.ts tests/security-dependencies.spec.ts tests/security-imports.spec.ts tests/turnstile-submit.spec.ts --project=chromium --workers=1

      - name: Verify instruments, electronics and localized pinouts
        run: npx playwright test tests/instruments.spec.ts tests/i2s-shared.spec.ts tests/electronics-shared.spec.ts tests/pinouts.spec.ts tests/pinout-translations.spec.ts tests/wiring-guide-translations.spec.ts tests/interactive-wiring.spec.ts --project=chromium --workers=2

      - name: Verify hardware tools on mobile and tablet
        run: npx playwright test tests/mobile-instruments.spec.ts tests/mobile-electronics.spec.ts tests/mobile-pinouts.spec.ts tests/mobile-wiring-guides.spec.ts tests/mobile-assembly.spec.ts --project=mobile-360 --project=mobile-390 --project=tablet-768 --workers=2

      - name: Audit implicit outbound traffic on every public route
        run: npx playwright test tests/site-locality.spec.ts --project=chromium --workers=3

      - name: Verify mobile layouts and interactions
        run: npx playwright test tests/mobile-responsive.spec.ts tests/mobile-usability.spec.ts tests/mobile-section-access.spec.ts tests/mobile-discovery.spec.ts --project=mobile-360 --project=mobile-390 --project=tablet-768 --workers=2

      - name: Audit all public pages at the narrowest supported width
        run: npx playwright test tests/mobile-pages.spec.ts --project=mobile-360 --workers=2

      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Only a manual run on main publishes. PRs and pushes never receive
      # deployment credentials, and any failed validation above blocks it.
      - name: Verify production deployment prerequisites
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
        run: |
          node scripts/security-release-check.mjs
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment token.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID.'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" || { echo 'Refusing to deploy an outdated main commit.'; exit 1; }

      - name: Deploy tested Worker to production
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

      - name: Verify production version and routes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: node scripts/verify-production.mjs
