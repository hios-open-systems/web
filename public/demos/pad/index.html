<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIOS PAD · Demo local</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--cy:#1fe0e0;--gn:#3ddc84;
    /* design tokens del pad (skin-ready: una skin solo cambia estas variables) */
    --pad-radius:14px;--key-w:86px;--key-h:98px;--key-gap:8px;--key-radius:12px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px}
  h1{font-size:16px;margin:0;font-weight:700;display:flex;gap:8px;align-items:center}
  h1 .tag{font-size:11px;background:#1f6feb;color:#fff;padding:2px 7px;border-radius:20px}
  #conn{font-size:12px;color:var(--mut)}
  #conn.on{color:var(--gn)} #conn.off{color:#f85149}
  /* La pantalla del pad: 480x320 escalada */
  .wrap{--s:1.15;width:calc(480px*var(--s));height:calc(320px*var(--s))}
  @media(max-width:580px){.wrap{--s:.74}}
  .pad{width:480px;height:320px;transform:scale(var(--s));transform-origin:top left;
    background:#0a0d12;border:1px solid var(--bd);border-radius:var(--pad-radius);overflow:hidden;position:relative;font-family:ui-monospace,Menlo,monospace}
  .hdr{height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:2px solid var(--accent,#1fe0e0)}
  .ldot{width:14px;height:14px;border-radius:50%;background:var(--accent,#1fe0e0);box-shadow:0 0 8px var(--accent,#1fe0e0)}
  .lname{font-size:18px;font-weight:700}
  .lgrp{font-size:11px;color:var(--mut)}
  .altbadge{display:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;color:#04121a;margin-left:4px}
  .altbadge.on{display:inline-block}
  .hsp{flex:1}
  .badge{font-size:11px;padding:3px 8px;border-radius:7px;border:1px solid var(--bd);color:var(--mut)}
  .badge.on{color:var(--gn);border-color:var(--gn)} .badge.warn{color:#f0a020;border-color:#f0a020} .badge.bad{color:#f85149;border-color:#f85149}
  .keys{position:absolute;top:54px;left:9px;display:flex;flex-wrap:wrap;width:462px;gap:var(--key-gap)}
  .key{width:var(--key-w);height:var(--key-h);border-radius:var(--key-radius);background:var(--panel);border:1px solid var(--bd);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 6px;position:relative;transition:.06s}
  .key .num{position:absolute;top:6px;left:8px;font-size:11px;color:var(--mut);font-weight:700}
  .key .well{width:38px;height:38px;border-radius:50%;background:#0e1319;border:1px solid var(--bd);margin-top:6px}
  .key .lbl{font-size:12px;font-weight:600;text-align:center;line-height:1.1;word-break:break-word}
  .key.down{background:var(--accent,#1fe0e0);color:#04121a;border-color:var(--accent)}
  .key.down .num{color:#04121a} .key.down .well{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.25)}
  .strip{position:absolute;left:9px;right:9px;bottom:8px;height:46px;display:flex;gap:8px}
  .seg{background:var(--panel);border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px}
  .seg .k{color:var(--mut);font-size:11px}
  .vol{flex:1;display:flex;align-items:center;gap:8px}
  .volbar{flex:1;height:8px;border-radius:5px;background:#0e1319;border:1px solid var(--bd);overflow:hidden}
  .volfill{height:100%;background:var(--accent,#1fe0e0);width:0%}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:20px}
  .note{font-size:11.5px;color:var(--mut);max-width:480px;text-align:center}

  .demo-controls{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:100%}
  .demo-controls label{display:flex;align-items:center;gap:8px;font-size:13px}
  select{background:#161b22;color:#e6edf3;border:1px solid #30363d;padding:6px;border-radius:6px}
  input[type=range]{max-width:130px}
  .key{cursor:pointer}.key:focus-visible{outline:3px solid #fff;outline-offset:-4px}
  .note{margin:0;line-height:1.6}.hdr{gap:6px}.badge{padding:3px 5px}
</style>
</head>
<body>

  <h1>HIOS PAD <span class="tag">demo local</span></h1>
  <p class="note">Interfaz del espejo del companion · datos de ejemplo · sin hardware</p>
  <div class="demo-controls">
    <label>Capa <select id="demo-layer" aria-label="Capa"><option value="0">Edición</option><option value="1">Multimedia</option><option value="2">Dev</option></select></label>
    <label>Volumen simulado <input id="demo-volume" type="range" min="0" max="100" value="42"></label>
  </div>
  <div class="wrap"><div class="pad" id="pad">
    <div class="empty" id="empty">Esperando al pad…<br><small>(abrí esto con el companion corriendo y el pad encendido)</small></div>
    <div class="hdr" id="hdr" style="display:none">
      <span class="ldot" id="ldot"></span>
      <span><span class="lname" id="lname">—</span> <span class="lgrp" id="lgrp"></span> <span class="altbadge" id="altbadge"></span></span>
      <span class="hsp"></span>
      <span class="badge" id="bMic">mic</span>
      <span class="badge" id="bLink">—</span>
      <span class="badge" id="bBat">bat</span>
      <span class="badge" id="bOs">os</span>
    </div>
    <div class="keys" id="keys"></div>
    <div class="strip" id="strip" style="display:none">
      <div class="seg" id="encSeg"><span class="k">ENC</span> <span id="encMode">capa</span></div>
      <div class="seg vol"><span class="k">VOL</span><div class="volbar"><div class="volfill" id="volfill"></div></div><span id="volnum">—</span></div>
    </div>
  </div></div>
  <p id="demo-output" class="note" role="status" aria-live="polite">Pulsá una tecla para ver su etiqueta. No se ejecutan acciones en tu PC.</p>

<script>
  const ENC_MODES = ["capa","Volumen","Scroll","Zoom","Pestañas"];
  // RGB565 -> #rrggbb
  function rgb565(c){
    const r=(c>>11)&0x1F,g=(c>>5)&0x3F,b=c&0x1F;
    const R=Math.round(r*255/31),G=Math.round(g*255/63),B=Math.round(b*255/31);
    return "#"+[R,G,B].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let layer = null;   // cache del descriptor de capa (llega solo al cambiar)
  const $=id=>document.getElementById(id);
  const keysEl=$("keys");
  const NKEYS=10;                 // 10 acciones en doble fila (2x5), igual que el pad
  for(let i=0;i<NKEYS;i++){
    const k=document.createElement("div"); k.className="key";
    k.innerHTML=`<span class="num">${i+1}</span><div class="well"></div><span class="lbl" id="lbl${i}"></span>`;
    keysEl.appendChild(k);
  }

  let gotLive=false;
  function render(ui){
    gotLive=true;
    $("empty").style.display="none";
    $("hdr").style.display="flex";
    $("strip").style.display="flex";
    if(ui.layer) layer = ui.layer;          // actualizar cache solo si vino el descriptor
    const accent = layer ? rgb565(layer.color) : "#1fe0e0";
    $("pad").style.setProperty("--accent", accent);
    $("hdr").style.borderBottomColor = accent;
    $("ldot").style.background = accent;
    $("lname").textContent = layer ? layer.n : "—";
    $("lgrp").textContent = layer ? `capa ${ (ui.lay??0)+1 }/${layer.count||"?"}` : "";
    const ab=$("altbadge");
    if(ui.alt){ ab.textContent="ALT"+ui.alt; ab.style.background=accent; ab.classList.add("on"); }
    else ab.classList.remove("on");

    // keycaps (10, doble fila)
    const labels = layer ? (layer.labels||[]) : [];
    for(let i=0;i<NKEYS;i++){
      $("lbl"+i).textContent = labels[i] || "";
      const k=keysEl.children[i];
      k.classList.toggle("down", !!(ui.b & (1<<i)));
    }
    // status badges
    setBadge("bMic", ui.mic?"MIC OFF":"mic", ui.mic?"bad":"");
    const tp=ui.tp||0, link = (tp&1)?"USB":(tp&2)?"BLE":"—";
    setBadge("bLink", link + ((tp&4)?" · wifi":""), (tp&3)?"on":"");
    const bat = ui.bat;
    setBadge("bBat", (bat===255||bat==null)?"bat —":bat+"%", bat===255?"":(bat<20?"bad":bat<40?"warn":"on"));
    setBadge("bOs", ui.os||"—", ui.os?"on":"");
    // strip
    $("encMode").textContent = ENC_MODES[ui.em||0] || "capa";
    const v = ui.vol==null?0:ui.vol;
    $("volfill").style.width = v+"%";
    $("volnum").textContent = (ui.vol==null?"—":v);
  }
  function setBadge(id,txt,cls){ const e=$(id); e.textContent=txt; e.className="badge"+(cls?" "+cls:""); }

  // Preview desde el NavModel (cfg.navigation/views del companion): muestra la
  // homeView como pad virtual cuando todavía no llegó un frame en vivo del pad.
  // Un frame real (gotLive) siempre tiene prioridad sobre el preview.
  // Local sample transport: no HTTP, SSE, USB, BLE or host keyboard events.
  const demoLayers = [{"n":"Edicion","color":2047,"labels":["Copiar","Pegar","Deshacer","Rehacer","Email","Cortar","Sel.todo","Buscar","Guardar","Reemplazar"],"em":2},{"n":"Multimedia","color":63519,"labels":["Anterior","Play","Siguiente","Mute","Stop","","","","",""],"em":1},{"n":"Dev","color":2016,"labels":["Terminal","Paleta","Comentar","Run","Build","Guardar","Ir a archivo","Simbolo","Formatear","Renombrar"],"em":3}];
  let selected = 0, demoVolume = 42, pressed = 0;
  const demoOutput = document.getElementById('demo-output');
  function demoRender() {
    const layer = demoLayers[selected];
    render({lay:selected, layer:{...layer,count:demoLayers.length}, b:pressed,
      tp:0, bat:255, os:'demo', mic:false, vol:demoVolume, em:layer.em});
    setBadge('bLink','DEMO','warn');
    document.getElementById('lgrp').textContent = 'ejemplo · ' + (selected+1) + '/3';
  }
  document.getElementById('demo-layer').onchange = e => {
    selected = Number(e.target.value); pressed = 0;
    demoOutput.textContent = 'Capa: ' + demoLayers[selected].n; demoRender();
  };
  document.getElementById('demo-volume').oninput = e => {
    demoVolume = Number(e.target.value);
    demoOutput.textContent = 'Volumen simulado: ' + demoVolume + '%'; demoRender();
  };
  Array.from(keysEl.children).forEach((key,i) => {
    key.tabIndex = 0; key.setAttribute('role','button');
    function activate() {
      pressed = 1 << i;
      demoOutput.textContent = 'Simulado: ' + (demoLayers[selected].labels[i] || 'Sin asignar');
      demoRender();
    }
    key.onclick = activate;
    key.onkeydown = e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
  });
  const wrap = document.querySelector('.wrap');
  function resizeDemo() {
    const scale = Math.min(1.15, Math.max(.1, (document.documentElement.clientWidth-36)/480));
    wrap.style.setProperty('--s', scale);
  }
  window.addEventListener('resize', resizeDemo); resizeDemo(); demoRender();

</script>
</body>
</html>
