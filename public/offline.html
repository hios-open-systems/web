<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · HIOS</title>
    <style>
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;
        font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#f8fafc}
      .card{max-width:420px;padding:32px;text-align:center}
      .dot{width:44px;height:44px;border-radius:12px;background:#f59e0b;color:#0b1220;
        display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 18px}
      h1{font-size:20px;margin:0 0 8px}
      p{color:#94a3b8;font-size:14px;line-height:1.6;margin:0}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">H</div>
      <h1>Sin conexión / Offline</h1>
      <p>No hay red ahora mismo. Las páginas que ya visitaste siguen disponibles; volvé a intentar cuando tengas conexión.<br /><br />You're offline. Pages you already visited still work — retry when you're back online.</p>
    </div>
  </body>
</html>
